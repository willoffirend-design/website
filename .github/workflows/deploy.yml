# Publishes the site: every push to main is mirrored to the gh-pages
# branch, which GitHub Pages serves at
# https://willoffirend-design.github.io/website/
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
